# Microservice Drift Tracker - Docker Compose
services:
  # Main Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CHROMADB_HOST=chroma
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      - neo4j
      - chroma
    networks:
      - mdt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mdt-network

  # User Service
  user-service:
    build:
      context: ./services/user_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_PORT=8001
    networks:
      - mdt-network

  # Order Service
  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=order-service
      - SERVICE_PORT=8002
      - USER_SERVICE_URL=http://user-service:8001
    depends_on:
      - user-service
    networks:
      - mdt-network

  # Payment Service
  payment-service:
    build:
      context: ./services/payment_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=payment-service
      - SERVICE_PORT=8003
    networks:
      - mdt-network

  # Notification Service
  notification-service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=notification-service
      - SERVICE_PORT=8004
    networks:
      - mdt-network

  # Neo4j Database
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - mdt-network

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - mdt-network

networks:
  mdt-network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
