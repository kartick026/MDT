# Prepared deployment blueprint. Applying it is a separate, explicit publish step.
services:
  - type: web
    name: mdt-alpha-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.hosted
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: RUNTIME_PROFILE
        value: hosted
      - key: ENVIRONMENT
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: ALLOW_SELF_SIGNUP
        value: "false"
      - key: ENABLE_DEFAULT_VIEWER
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MAX_JOBS_PER_DAY
        value: "30"
