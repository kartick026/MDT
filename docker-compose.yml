# Microservice Drift Tracker - Production-Ready Docker Compose
services:
  # Main Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - CHROMADB_MODE=server
      - CHROMADB_HOST=chroma
      - CHROMADB_PORT=8000  # Internal container port on chroma service (exposed to host as 8005)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      # Repository onboarding writes registry.json at runtime. Keep that
      # project model when the backend image is rebuilt or recreated.
      - registry_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 256M
    networks:
      - mdt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - mdt-network

  # User Service
  user-service:
    build:
      context: ./services/user_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_PORT=8001
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mdt-network

  # Order Service
  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=order-service
      - SERVICE_PORT=8002
      - USER_SERVICE_URL=http://user-service:8001
    depends_on:
      - user-service
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mdt-network

  # Payment Service
  payment-service:
    build:
      context: ./services/payment_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=payment-service
      - SERVICE_PORT=8003
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mdt-network

  # Notification Service
  notification-service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=notification-service
      - SERVICE_PORT=8004
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mdt-network

  # Neo4j Database
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    networks:
      - mdt-network

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      - mdt-network

networks:
  mdt-network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
  registry_data:
